[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthlab"
version = "0.0.1"
description = "Customer intelligence and causal decision science portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb==2.0.0"]

[project.scripts]
growthlab-acquire = "growthlab.acquire:main"
growthlab-audit = "growthlab.audit:main"

[tool.setuptools.packages.find]
where = ["src"]
