[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthlab"
version = "0.0.1"
description = "Customer intelligence and causal decision science portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb==2.0.0"]

[project.optional-dependencies]
studio = [
    "streamlit==1.67.0",
    "plotly==7.1.0",
    "scipy==1.18.1",
]
modeling = [
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
    "threadpoolctl==3.7.0",
]

[project.scripts]
growthlab-acquire = "growthlab.acquire:main"
growthlab-audit = "growthlab.audit:main"

[tool.setuptools.packages.find]
where = ["src"]
